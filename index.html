<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CGPA Calculator — By Noor Ullah</title>
<style>
*{box-sizing:border-box}
:root{
 --blue:#2563eb;--blue2:#1d4ed8;--navy:#172554;--green:#16a34a;
 --red:#dc2626;--gray:#64748b;--bg:#f1f5f9;--card:#fff;
 --text:#172033;--muted:#64748b;--border:#e2e8f0;
}
*{font-family:Arial,Helvetica,sans-serif}
body{margin:0;background:var(--bg);color:var(--text)}
.container{max-width:950px;margin:auto;padding:14px}
.header{
 position:relative;text-align:center;color:white;padding:34px 18px;margin-bottom:16px;
 border-radius:25px;background:linear-gradient(135deg,#172554,#2563eb);
 box-shadow:0 12px 30px rgba(37,99,235,.18)
}
.header-icon{font-size:42px}.header h1{margin:8px 0;font-size:29px}
.header p{margin:5px 0;opacity:.9}.creator{display:inline-block;margin-top:12px;padding:8px 15px;
 background:rgba(255,255,255,.15);border-radius:30px;font-size:12px}
.theme{position:absolute;right:12px;top:12px;width:40px;height:40px;border:0;border-radius:50%;
 background:rgba(255,255,255,.15);color:white;font-size:18px}
.card{background:var(--card);border:1px solid var(--border);border-radius:21px;padding:20px;margin-bottom:16px;
 box-shadow:0 6px 22px rgba(15,23,42,.05)}
.title{font-size:19px;font-weight:bold;margin-bottom:16px}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
label{display:block;font-size:12px;font-weight:bold;color:var(--muted);margin:0 0 7px}
input{width:100%;height:46px;border:1px solid var(--border);border-radius:11px;padding:0 12px;
 background:#f8fafc;color:var(--text);font-size:14px;outline:none}
input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.semester{background:#f8fafc;border:1px solid var(--border);border-radius:18px;padding:15px;margin-bottom:14px}
.semester-top{display:flex;gap:10px;align-items:center;margin-bottom:13px}
.semester-title{font-size:18px;font-weight:bold;flex:1}
.semester-title input{font-weight:bold;background:white}
.subject{background:white;border:1px solid var(--border);border-radius:15px;padding:13px;margin-bottom:10px}
.subject-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.subject-number{font-size:13px;font-weight:bold;color:var(--muted)}
.subject-grid{display:grid;grid-template-columns:2fr 1fr 1fr 90px;gap:9px}
.gpa{height:46px;border-radius:11px;background:#dbeafe;color:#1d4ed8;
 display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:15px}
.fail{background:#fee2e2!important;color:#dc2626!important}
.btn{border:0;border-radius:11px;min-height:46px;padding:10px 14px;color:white;font-weight:bold;font-size:14px;cursor:pointer}
.btn:active{transform:scale(.99)}
.blue{background:var(--blue)}.green{background:var(--green)}.gray{background:var(--gray)}.red{background:var(--red)}
.add-subject{width:100%;margin-top:3px}.delete{border:0;cursor:pointer;border-radius:9px;padding:9px 11px;background:#fee2e2;color:#dc2626;font-weight:bold}
.semester-result{display:flex;justify-content:space-between;align-items:center;padding:12px;margin-top:12px;
 background:white;border:1px solid var(--border);border-radius:11px}
.semester-result span{color:var(--muted);font-size:13px}.semester-result strong{color:var(--blue);font-size:19px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:17px;padding:16px;text-align:center}
.stat small{display:block;color:var(--muted);font-weight:bold;font-size:10px;margin-bottom:6px}.stat strong{font-size:23px}
.result{text-align:center;color:white;padding:28px 18px;margin-bottom:16px;border-radius:24px;
 background:linear-gradient(135deg,#172554,#1e40af)}
.result-label{font-size:12px;letter-spacing:3px}.cgpa{font-size:64px;font-weight:900;margin:5px}
.message{font-size:13px;opacity:.9}
.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.footer{text-align:center;color:var(--muted);font-size:11px;padding:4px 0 25px}
body.dark{--bg:#0f172a;--card:#1e293b;--text:#f8fafc;--muted:#94a3b8;--border:#334155}
body.dark input,body.dark .semester,body.dark .subject,body.dark .semester-result{background:#172033;color:#f8fafc}
body.dark .subject{background:#1e293b}
body.dark .delete{background:#451a1a}
@media(max-width:650px){
 .info-grid,.action-grid{grid-template-columns:1fr}
 .subject-grid{grid-template-columns:1fr 1fr}
 .subject-name{grid-column:1/3}.gpa-box{grid-column:1/3}
 .stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/3}
 .header h1{font-size:25px}.cgpa{font-size:55px}
}
@media print{
 @page{size:A4;margin:12mm}
 body{background:white!important;color:#111!important}
 .theme,.delete,.add-subject,.add-semester,.actions,.footer{display:none!important}
 .card,.stat{box-shadow:none}.semester{break-inside:avoid;background:white!important}
 input{background:white!important;color:#111!important}
 .header,.result{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="container">

<header class="header">
<button class="theme" id="themeBtn" type="button">🌙</button>
<div class="header-icon">🎓</div>
<div>WELCOME</div>
<h1>CGPA Calculator</h1>
<p>Professional GPA & CGPA Calculator for Students</p>
<div class="creator">✨ CGPA Calculator by <b>Noor Ullah</b></div>
</header>

<section class="card">
<div class="title">👨‍🎓 Student Information</div>
<div class="info-grid">
<div><label>Student Name</label><input id="studentName" type="text" placeholder="Enter student name"></div>
<div><label>University / Institute</label><input id="university" type="text" placeholder="Enter university name"></div>
</div>
</section>

<section class="card">
<div class="title">📚 Academic Record</div>
<div id="semesters"></div>
<button class="btn blue add-semester" id="addSemester" type="button">＋ Add Semester</button>
</section>

<div class="stats">
<div class="stat"><small>SEMESTERS</small><strong id="semesterCount">0</strong></div>
<div class="stat"><small>SUBJECTS</small><strong id="subjectCount">0</strong></div>
<div class="stat"><small>CREDIT HOURS</small><strong id="creditCount">0.00</strong></div>
</div>

<section class="result">
<div class="result-label">OVERALL CGPA</div>
<div class="cgpa" id="cgpa">0.00</div>
<div class="message" id="message">Add subjects, marks and credit hours</div>
</section>

<section class="card actions">
<div class="action-grid">
<button class="btn green" id="printBtn" type="button">🖨️ Print Transcript</button>
<button class="btn gray" id="shareBtn" type="button">📤 Share Result</button>
<button class="btn blue" id="saveBtn" type="button">💾 Save Data</button>
<button class="btn red" id="resetBtn" type="button">🔄 Reset All</button>
</div>
</section>

<div class="footer"><b>CGPA Calculator by Noor Ullah</b><br>Made with ❤️ for Students</div>
</div>

<script>
"use strict";

/* HEC grading points — NO letter grade is shown automatically. */
function gradePoint(marks){
  marks = Number(marks);
  if (!Number.isFinite(marks)) return null;
  if (marks >= 85) return 4.00;
  if (marks >= 80) return 3.70;
  if (marks >= 75) return 3.30;
  if (marks >= 70) return 3.00;
  if (marks >= 65) return 2.70;
  if (marks >= 60) return 2.30;
  if (marks >= 55) return 2.00;
  if (marks >= 50) return 1.70;
  if (marks >= 45) return 1.00;
  return 0.00;
}

let semesters = [];
let nextSemesterId = 1;
let nextSubjectId = 1;

const $ = id => document.getElementById(id);

function makeSubject(){
  return {id: nextSubjectId++, name:"", credits:"", marks:""};
}

function makeSemester(){
  return {id: nextSemesterId++, name:"", subjects:[makeSubject()]};
}

function init(){
  const saved = localStorage.getItem("noor_cgpa_data");
  if(saved){
    try{
      const data = JSON.parse(saved);
      if(Array.isArray(data.semesters) && data.semesters.length){
        semesters = data.semesters;
        nextSemesterId = data.nextSemesterId || 1;
        nextSubjectId = data.nextSubjectId || 1;
        $("studentName").value = data.studentName || "";
        $("university").value = data.university || "";
      }
    }catch(e){}
  }
  if(!semesters.length) semesters = [makeSemester()];
  render();
  calculateAll();
}

function addSemester(){
  semesters.push(makeSemester());
  render();
  calculateAll();
  saveData(false);
}

function addSubject(semesterId){
  const sem = semesters.find(s => s.id === semesterId);
  if(!sem) return;
  sem.subjects.push(makeSubject());
  render();
  calculateAll();
  saveData(false);
}

function removeSemester(id){
  if(semesters.length === 1){
    alert("At least one semester is required.");
    return;
  }
  semesters = semesters.filter(s => s.id !== id);
  render();
  calculateAll();
  saveData(false);
}

function removeSubject(semesterId, subjectId){
  const sem = semesters.find(s => s.id === semesterId);
  if(!sem) return;
  if(sem.subjects.length === 1){
    alert("At least one subject is required in each semester.");
    return;
  }
  sem.subjects = sem.subjects.filter(x => x.id !== subjectId);
  render();
  calculateAll();
  saveData(false);
}

function render(){
  const box = $("semesters");
  box.innerHTML = "";

  semesters.forEach((sem, si) => {
    const div = document.createElement("div");
    div.className = "semester";

    const top = document.createElement("div");
    top.className = "semester-top";

    const nameWrap = document.createElement("div");
    nameWrap.className = "semester-title";
    const nameInput = document.createElement("input");
    nameInput.type = "text";
    nameInput.placeholder = "Semester name (e.g. Fall 2026)";
    nameInput.value = sem.name || "";
    nameInput.addEventListener("input", e => {
      sem.name = e.target.value;
      saveData(false);
    });
    nameWrap.appendChild(nameInput);

    const delSem = document.createElement("button");
    delSem.className = "delete";
    delSem.type = "button";
    delSem.textContent = "🗑️";
    delSem.title = "Delete semester";
    delSem.addEventListener("click", () => removeSemester(sem.id));

    top.appendChild(nameWrap);
    top.appendChild(delSem);
    div.appendChild(top);

    sem.subjects.forEach((sub, idx) => {
      const card = document.createElement("div");
      card.className = "subject";

      const st = document.createElement("div");
      st.className = "subject-top";
      const sn = document.createElement("div");
      sn.className = "subject-number";
      sn.textContent = "Subject " + (idx + 1);

      const delSub = document.createElement("button");
      delSub.className = "delete";
      delSub.type = "button";
      delSub.textContent = "✕";
      delSub.addEventListener("click", () => removeSubject(sem.id, sub.id));
      st.append(sn, delSub);
      card.appendChild(st);

      const grid = document.createElement("div");
      grid.className = "subject-grid";

      const nameBox = document.createElement("div");
      nameBox.className = "subject-name";
      nameBox.appendChild(label("Subject Name"));
      const name = inputText(sub.name, "e.g. Programming");
      name.addEventListener("input", e => {sub.name=e.target.value; saveData(false);});
      nameBox.appendChild(name);

      const creditBox = document.createElement("div");
      creditBox.appendChild(label("Credit Hours"));
      const credit = document.createElement("input");
      credit.type="number"; credit.min="0"; credit.step="0.5"; credit.placeholder="3"; credit.value=sub.credits;
      credit.addEventListener("input", e => {sub.credits=e.target.value; calculateAll(); saveData(false);});
      creditBox.appendChild(credit);

      const marksBox = document.createElement("div");
      marksBox.appendChild(label("Subject Marks"));
      const marks = document.createElement("input");
      marks.type="number"; marks.min="0"; marks.max="100"; marks.step="0.01"; marks.placeholder="85"; marks.value=sub.marks;
      marks.addEventListener("input", e => {
        let v=e.target.value;
        if(v!=="" && Number(v)>100){v="100";e.target.value=v;}
        if(v!=="" && Number(v)<0){v="0";e.target.value=v;}
        sub.marks=v; calculateAll(); saveData(false);
      });
      marksBox.appendChild(marks);

      const gpaBox = document.createElement("div");
      gpaBox.className="gpa-box";
      gpaBox.appendChild(label("GPA"));
      const gpa = document.createElement("div");
      gpa.className="gpa";
      gpa.id="gpa-"+sem.id+"-"+sub.id;
      gpaBox.appendChild(gpa);

      grid.append(nameBox,creditBox,marksBox,gpaBox);
      card.appendChild(grid);
      div.appendChild(card);
    });

    const addSub = document.createElement("button");
    addSub.className="btn blue add-subject";
    addSub.type="button";
    addSub.textContent="＋ Add Subject";
    addSub.addEventListener("click",()=>addSubject(sem.id));
    div.appendChild(addSub);

    const result = document.createElement("div");
    result.className="semester-result";
    result.innerHTML='<span>Semester GPA</span><strong id="semgpa-'+sem.id+'">0.00</strong>';
    div.appendChild(result);

    box.appendChild(div);
  });
}

function label(text){
  const l=document.createElement("label"); l.textContent=text; return l;
}
function inputText(value,placeholder){
  const i=document.createElement("input"); i.type="text"; i.value=value||""; i.placeholder=placeholder; return i;
}

function calculateAll(){
  let totalWeighted=0, totalCredits=0, subjectCount=0, validSubjects=0;

  semesters.forEach(sem=>{
    let semWeighted=0, semCredits=0;

    sem.subjects.forEach(sub=>{
      subjectCount++;
      const m=Number(sub.marks), c=Number(sub.credits);
      const gp=gradePoint(sub.marks);
      const gpaEl=$("gpa-"+sem.id+"-"+sub.id);

      if(gpaEl){
        gpaEl.classList.remove("fail");
        gpaEl.textContent = gp===null ? "—" : gp.toFixed(2);
        if(gp===0 && Number.isFinite(m)) gpaEl.classList.add("fail");
      }

      if(Number.isFinite(m) && m>=0 && m<=100 && Number.isFinite(c) && c>0){
        semWeighted += gp*c;
        semCredits += c;
        totalWeighted += gp*c;
        totalCredits += c;
        validSubjects++;
      }
    });

    const semEl=$("semgpa-"+sem.id);
    if(semEl) semEl.textContent=semCredits>0 ? (semWeighted/semCredits).toFixed(2) : "0.00";
  });

  $("semesterCount").textContent=semesters.length;
  $("subjectCount").textContent=subjectCount;
  $("creditCount").textContent=totalCredits.toFixed(2);

  const cgpa=totalCredits>0 ? totalWeighted/totalCredits : 0;
  $("cgpa").textContent=cgpa.toFixed(2);

  if(validSubjects===0) $("message").textContent="Enter marks and credit hours to calculate CGPA";
  else $("message").textContent="Calculated using credit-hour weighted GPA";
}

function saveData(show){
  const data={
    studentName:$("studentName").value,
    university:$("university").value,
    semesters,nextSemesterId,nextSubjectId
  };
  localStorage.setItem("noor_cgpa_data",JSON.stringify(data));
  if(show) alert("✅ Data saved successfully on this device.");
}

function resetAll(){
  if(!confirm("Are you sure you want to reset the complete record?")) return;
  localStorage.removeItem("noor_cgpa_data");
  semesters=[makeSemester()];
  $("studentName").value="";
  $("university").value="";
  render();
  calculateAll();
}

function printTranscript(){
  calculateAll();
  window.print();
}

async function shareResult(){
  const name=$("studentName").value.trim() || "Student";
  const uni=$("university").value.trim();
  const text="🎓 CGPA Result\nStudent: "+name+
    (uni ? "\nUniversity: "+uni : "")+
    "\nCGPA: "+$("cgpa").textContent+
    "\n\nCGPA Calculator by Noor Ullah";
  if(navigator.share){
    try{await navigator.share({title:"CGPA Result",text});}catch(e){}
  }else{
    try{await navigator.clipboard.writeText(text);alert("✅ Result copied. You can paste it anywhere.");}
    catch(e){alert(text);}
  }
}

$("addSemester").addEventListener("click",addSemester);
$("printBtn").addEventListener("click",printTranscript);
$("shareBtn").addEventListener("click",shareResult);
$("saveBtn").addEventListener("click",()=>saveData(true));
$("resetBtn").addEventListener("click",resetAll);
$("studentName").addEventListener("input",()=>saveData(false));
$("university").addEventListener("input",()=>saveData(false));

$("themeBtn").addEventListener("click",()=>{
  document.body.classList.toggle("dark");
  $("themeBtn").textContent=document.body.classList.contains("dark")?"☀️":"🌙";
});

init();
</script>
</body>
</html>
