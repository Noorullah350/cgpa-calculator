<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VideoFlow Downloader</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    color: #111827;
}

.container {
    max-width: 700px;
    margin: 0 auto;
    padding: 30px 18px;
}

header {
    text-align: center;
    margin-bottom: 30px;
}

.logo {
    font-size: 42px;
}

h1 {
    margin: 8px 0;
}

.subtitle {
    color: #6b7280;
}

.card {
    background: white;
    padding: 22px;
    border-radius: 18px;
    box-shadow: 0 5px 25px rgba(0,0,0,.08);
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
}

.input-row {
    display: flex;
    gap: 8px;
}

input {
    flex: 1;
    padding: 14px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    font-size: 15px;
}

button {
    border: 0;
    border-radius: 10px;
    padding: 14px 18px;
    font-weight: bold;
    cursor: pointer;
}

.check-btn {
    margin-top: 14px;
    width: 100%;
    background: #111827;
    color: white;
}

button:disabled {
    opacity: .6;
}

#result {
    margin-top: 20px;
}

.video-info {
    display: flex;
    gap: 15px;
    margin-bottom: 20px;
}

.thumbnail {
    width: 140px;
    border-radius: 10px;
    object-fit: cover;
}

.title {
    font-weight: bold;
    font-size: 18px;
}

.quality {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px;
    margin: 8px 0;
    background: #f3f4f6;
    border-radius: 10px;
}

.download-btn {
    background: #16a34a;
    color: white;
    padding: 9px 14px;
}

.message {
    padding: 12px;
    border-radius: 10px;
    background: #fff7ed;
    color: #9a3412;
}

.notice {
    margin-top: 20px;
    padding: 15px;
    background: #eef2ff;
    border-radius: 12px;
    color: #3730a3;
    font-size: 14px;
}

footer {
    text-align: center;
    margin-top: 25px;
    color: #6b7280;
    font-size: 13px;
}

@media(max-width:600px) {
    .input-row {
        flex-direction: column;
    }

    .video-info {
        flex-direction: column;
    }

    .thumbnail {
        width: 100%;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <div class="logo">🎥</div>
    <h1>VideoFlow Downloader</h1>
    <div class="subtitle">
        Paste a direct video URL and check available video formats.
    </div>
</header>

<div class="card">

<label for="videoUrl">Video URL</label>

<div class="input-row">
    <input
        id="videoUrl"
        type="url"
        placeholder="https://youtube.com/..."
    >
</div>

<button class="check-btn" id="checkBtn" onclick="checkVideo()">
    🔍 Check Video
</button>

<div id="result"></div>

</div>

<div class="notice">
    <strong>ℹ️ Important</strong><br><br>
    Use VideoFlow only for videos you own or have permission to download.
    Private, DRM-protected and restricted content may not be available.
</div>

<footer>
    <strong>VideoFlow Downloader</strong><br>
    Personal Use Version 1.0
</footer>

</div>

<script>

const API = "http://127.0.0.1:8765";

async function checkVideo() {

    const input = document.getElementById("videoUrl");
    const button = document.getElementById("checkBtn");
    const result = document.getElementById("result");

    const url = input.value.trim();

    if (!url) {
        result.innerHTML =
            '<div class="message">Please enter a video URL.</div>';
        return;
    }

    button.disabled = true;
    button.textContent = "Checking video...";
    result.innerHTML = "";

    try {

        const response = await fetch(
            API + "/info?url=" + encodeURIComponent(url)
        );

        const data = await response.json();

        if (!data.success) {
            throw new Error(data.message || "Unable to get video information.");
        }

        let html = "";

        html += `
            <div class="video-info">
                ${
                    data.thumbnail
                    ? `<img class="thumbnail" src="${escapeHtml(data.thumbnail)}">`
                    : ""
                }

                <div>
                    <div class="title">
                        ${escapeHtml(data.title || "Video")}
                    </div>

                    <p>
                        Source: ${escapeHtml(data.source || "Video")}
                    </p>
                </div>
            </div>
        `;

        const qualities = (data.qualities || []).filter(item => {
            return item.url &&
                   item.url.includes("googlevideo.com");
        });

        if (!qualities.length) {

            html += `
                <div class="message">
                    No downloadable video formats were found.
                </div>
            `;

        } else {

            html += `<h3>Available Qualities</h3>`;

            qualities.forEach(item => {

                html += `
                    <div class="quality">
                        <strong>${escapeHtml(item.quality)}</strong>

                        <button
                            class="download-btn"
                            onclick="downloadVideo('${escapeHtml(url)}', 'best')"
                        >
                            Download
                        </button>
                    </div>
                `;

            });
        }

        result.innerHTML = html;

    } catch (error) {

        result.innerHTML = `
            <div class="message">
                Error: ${escapeHtml(error.message)}
            </div>
        `;

    } finally {

        button.disabled = false;
        button.textContent = "🔍 Check Video";

    }
}

function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


async function downloadVideo(url, quality) {
    const popup = document.createElement("div");

    popup.style.cssText =
        "position:fixed;inset:0;background:rgba(0,0,0,.65);" +
        "display:flex;align-items:center;justify-content:center;" +
        "z-index:9999;padding:20px;";

    popup.innerHTML = `
        <div style="background:#fff;color:#111;width:min(420px,100%);
                    border-radius:18px;padding:25px;text-align:center;">
            <h3>Downloading Video</h3>
            <div id="vfProgressText" style="font-size:28px;font-weight:bold;">
                0%
            </div>
            <div style="background:#ddd;border-radius:20px;height:12px;
                        overflow:hidden;margin:18px 0;">
                <div id="vfProgressBar"
                     style="height:100%;width:0%;transition:width .3s;"></div>
            </div>
            <div id="vfProgressMessage">Starting download...</div>
        </div>
    `;

    document.body.appendChild(popup);

    try {
        const start = await fetch(
            API + "/download?url=" +
            encodeURIComponent(url) +
            "&quality=" +
            encodeURIComponent(quality)
        );

        const job = await start.json();

        if (!job.success) {
            throw new Error(job.message || "Unable to start download.");
        }

        const timer = setInterval(async () => {
            try {
                const response = await fetch(
                    API + "/progress?id=" +
                    encodeURIComponent(job.job_id)
                );

                const data = await response.json();

                const percent = Math.round(Number(data.progress || 0));

                document.getElementById("vfProgressText").textContent =
                    percent + "%";

                document.getElementById("vfProgressBar").style.width =
                    percent + "%";

                document.getElementById("vfProgressMessage").textContent =
                    data.message || "Downloading...";

                if (data.status === "completed") {
                    clearInterval(timer);
                    document.getElementById("vfProgressMessage").textContent =
                        "✅ Download completed!";
                }

                if (data.status === "error") {
                    clearInterval(timer);
                    document.getElementById("vfProgressMessage").textContent =
                        "❌ " + (data.message || "Download failed.");
                }

            } catch (e) {
                clearInterval(timer);
                document.getElementById("vfProgressMessage").textContent =
                    "❌ " + e.message;
            }
        }, 800);

    } catch (error) {
        document.getElementById("vfProgressMessage").textContent =
            "❌ " + error.message;
    }
}

</script>

</body>
</html>
